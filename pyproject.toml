[project]
name = "quantity-parser"
version = "0.1.0"
description = "Strict parser turning English numeric phrases into exact typed quantities"
readme = "README.md"
authors = [
    { name = "aminesayagh", email = "aminesayagh1997@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "lark==1.3.1",
    "text2num==3.1.0",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
